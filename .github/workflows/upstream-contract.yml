name: Upstream contract check

# The Bupa API publishes no response schema, so we check the live endpoint
# against our expectations on a schedule. A failure means upstream changed shape:
# investigate before users notice.
on:
  schedule:
    - cron: '17 21 * * *' # daily, ~08:17 Sydney time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: api/global.json

      - name: Run live contract tests
        run: dotnet test tests/BupaBooks.Infrastructure.Tests --filter "Category=LiveContract"
