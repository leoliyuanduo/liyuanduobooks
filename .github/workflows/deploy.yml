name: Deploy

# Continuous delivery to Azure Container Apps, after the Container workflow has built,
# tested, scanned and published the image for a commit on main.
#
# - Authentication is GitHub OIDC federated to an Entra ID app registration: no cloud
#   secret is stored in GitHub.
# - The "production" GitHub environment carries the approval gate (required reviewers)
#   and the Azure identifiers (as variables; they are identifiers, not secrets).
# - Skipped entirely until AZURE_CLIENT_ID is configured, so forks and reviewers without
#   Azure see a clean pipeline. Setup: infra/README.md.
on:
  workflow_run:
    workflows: [Container]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-<full commit sha>). Defaults to the current commit.'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deployment half-way

jobs:
  deploy:
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.output.outputs.app_url }}
    permissions:
      contents: read
      id-token: write # to request the OIDC token for Azure
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the image to deploy
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          tag="${REQUESTED_TAG:-sha-$COMMIT_SHA}"
          echo "ref=ghcr.io/$repository:$tag" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false

      - name: Init (remote state in Azure Storage, Entra ID auth)
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=bupa-books/production.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Plan
        env:
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_container_image: ${{ steps.image.outputs.ref }}
          # Only needed if the GHCR package is private (it can simply be made public instead).
          TF_VAR_registry_server: ${{ secrets.GHCR_READ_TOKEN != '' && 'ghcr.io' || '' }}
          TF_VAR_registry_username: ${{ github.repository_owner }}
          TF_VAR_registry_password: ${{ secrets.GHCR_READ_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Publish the URL
        id: output
        run: echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

      # Post-deployment smoke test: the release is only "done" when it answers.
      - name: Smoke test
        env:
          APP_URL: ${{ steps.output.outputs.app_url }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$APP_URL/health/ready" > /dev/null; then
              curl --fail --silent "$APP_URL/api/v1/books?ageCategory=adult" > /dev/null
              echo "Deployed and healthy: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$APP_URL did not become healthy"
          exit 1
