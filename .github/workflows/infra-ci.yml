name: Infrastructure CI

# Static checks for the Terraform: formatting, validity, lint rules and security
# policy. Needs no cloud credentials, so it runs on every pull request.
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra-ci.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.9'

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Lint (tflint, azurerm ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

      - name: Security policy (checkov)
        run: |
          pipx install checkov
          checkov --directory . --framework terraform --compact --quiet
