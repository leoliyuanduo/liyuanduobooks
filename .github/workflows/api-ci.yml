name: API CI

on:
  pull_request:
    paths: ['api/**', '.github/workflows/api-ci.yml']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-ci.yml']

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this also gates nullability and analyzers.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The build regenerates the OpenAPI document. If it differs from the committed
      # file, the API contract changed without the change being reviewed.
      - name: OpenAPI contract drift check
        run: |
          if [ -n "$(git status --porcelain -- src/BupaBooks.Host/openapi)" ]; then
            git --no-pager diff -- src/BupaBooks.Host/openapi
            echo "::error::OpenAPI document is out of date. Run 'dotnet build' and commit src/BupaBooks.Host/openapi/."
            exit 1
          fi

      # Live upstream calls are excluded here (flaky by nature); they run on a schedule instead.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --filter "Category!=LiveContract"
          --logger trx
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Vulnerable package check
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/TestResults
          retention-days: 7
