# Actions are pinned to full commit SHAs (tag in the comment): a moved or hijacked tag
# cannot change what runs in our pipeline. Dependabot proposes updates.
name: Web CI

on:
  pull_request:
    paths:
      [
        "web/**",
        "api/src/BupaBooks.Host/openapi/**",
        ".github/workflows/web-ci.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "api/src/BupaBooks.Host/openapi/**",
        ".github/workflows/web-ci.yml",
      ]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      # The server's OpenAPI document is the contract. If the generated types differ
      # from the committed ones, the client was not updated for an API change.
      - name: API types are up to date
        run: npm run check:api

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests with coverage gate
        run: npm run test:coverage

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npx vite build
